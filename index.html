<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Bolhas de fundo */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }

    body::before {
      width: 400px;
      height: 400px;
      background: #7c3aed;
      top: -100px;
      left: -100px;
    }

    body::after {
      width: 350px;
      height: 350px;
      background: #2563eb;
      bottom: -80px;
      right: -80px;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(30px) scale(1.05); }
    }

    /* Card */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 1;
    }

    /* Logo / avatar */
    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .logo-circle {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.5);
    }

    .logo-circle svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    /* Título */
    h1 {
      text-align: center;
      color: #ffffff;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.875rem;
      margin-bottom: 36px;
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      transition: fill 0.2s;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    input:focus {
      border-color: #7c3aed;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }

    input:focus + svg,
    .input-wrapper:focus-within svg {
      fill: #a78bfa;
    }

    /* Esqueci a senha */
    .row {
      display: flex;
      justify-content: flex-end;
      margin-top: -6px;
      margin-bottom: 28px;
    }

    .row a {
      color: #a78bfa;
      font-size: 0.8rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .row a:hover {
      color: #c4b5fd;
    }

    /* Botão */
    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    button[type="submit"]:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(124, 58, 237, 0.5);
    }

    button[type="submit"]:active {
      transform: translateY(0);
    }

    /* Divisor */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
    }

    .divider span {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .divider p {
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    /* Botão Google */
    .btn-google {
      width: 100%;
      padding: 13px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-google:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    /* Rodapé */
    .footer {
      text-align: center;
      margin-top: 28px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
    }

    .footer a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: #c4b5fd;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-circle">
        <!-- Ícone de cadeado -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2
                   2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm4
                   10.72V18h-2v-1.28A2 2 0 1 1 13 16.72z"/>
        </svg>
      </div>
    </div>

    <h1>Bem-vindo de volta</h1>
    <p class="subtitle">Entre na sua conta para continuar</p>

    <form>
      <!-- Email -->
      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <input type="text" id="email" placeholder="seu@email.com" />
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0
                     2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </div>
      </div>

      <!-- Senha -->
      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="••••••••" />
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2
                     2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm4
                     10.72V18h-2v-1.28A2 2 0 1 1 13 16.72z"/>
          </svg>
        </div>
      </div>

      <!-- Esqueci -->
      <div class="row">
        <a href="#">Esqueci minha senha</a>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <!-- Divisor -->
    <div class="divider">
      <span></span>
      <p>ou continue com</p>
      <span></span>
    </div>

    <!-- Google -->
    <button class="btn-google">
      <!-- Google "G" colorido -->
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.85l6.1-6.1C34.46 3.04
               29.5 1 24 1 14.82 1 7.07 6.48 3.64 14.22l7.1 5.52C12.44 13.67 17.77
               9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.52 24.5c0-1.64-.15-3.22-.42-4.74H24v8.98h12.7
               c-.55 2.93-2.2 5.41-4.68 7.08l7.18 5.58C43.45 37.28 46.52 31.35
               46.52 24.5z"/>
        <path fill="#FBBC05" d="M10.74 28.26A14.63 14.63 0 0 1 9.5 24c0-1.48.26-2.91
               .74-4.26l-7.1-5.52A23.93 23.93 0 0 0 0 24c0 3.88.93 7.55 2.56
               10.8l8.18-6.54z"/>
        <path fill="#34A853" d="M24 47c5.5 0 10.12-1.82 13.49-4.94l-7.18-5.58c-1.99
               1.34-4.54 2.13-6.31 2.13-6.23 0-11.56-4.17-13.26-9.74l-8.18
               6.54C7.07 41.52 14.82 47 24 47z"/>
      </svg>
      Entrar com Google
    </button>

    <!-- Rodapé -->
    <p class="footer">Não tem uma conta? <a href="#">Cadastre-se</a></p>

  </div>

</body>
</html>
